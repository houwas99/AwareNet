<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ campaign_name }} — Security Check</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
     background:#080810;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
     padding:20px;color:#fff;}
.card{background:#13131f;border:1px solid rgba(255,255,255,.07);border-radius:16px;
      padding:48px 40px;max-width:420px;width:100%;text-align:center;
      animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
.shield{font-size:3rem;margin-bottom:16px;}
h1{font-size:1.3rem;font-weight:700;margin-bottom:8px;}
p{color:#888;font-size:.85rem;line-height:1.7;margin-bottom:24px;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.08);
         border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;
         margin:0 auto 20px;}
.btn{display:inline-block;padding:12px 32px;background:#3b82f6;color:#fff;
     border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;
     font-family:inherit;text-decoration:none;transition:background .15s;}
.btn:hover{background:#2563eb;}
.hidden{display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="card">
  <div class="shield">🛡</div>
  <h1 data-i18n="pretext_title">You have been redirected</h1>
  <p data-i18n="pretext_desc">Please wait while we verify your connection...</p>
  <div class="spinner" id="spinner"></div>
  <a class="btn hidden" id="continue-btn" href="/{{ slug }}?skip_pretext=1" data-i18n="pretext_btn">Continue</a>
</div>
<script>
setTimeout(function(){
  document.getElementById('spinner').classList.add('hidden');
  document.getElementById('continue-btn').classList.remove('hidden');
}, 3000);

var lang = '{{ lang }}';
var translations = {
  "en": {
    "pretext_title": "You have been redirected",
    "pretext_desc": "Please wait while we verify your connection...",
    "pretext_btn": "Continue"
  },
  "fr": {
    "pretext_title": "Vous avez été redirigé",
    "pretext_desc": "Veuillez patienter pendant que nous vérifions votre connexion...",
    "pretext_btn": "Continuer"
  },
  "es": {
    "pretext_title": "Ha sido redirigido",
    "pretext_desc": "Espere mientras verificamos su conexión...",
    "pretext_btn": "Continuar"
  },
  "de": {
    "pretext_title": "Sie wurden weitergeleitet",
    "pretext_desc": "Bitte warten Sie, während wir Ihre Verbindung überprüfen...",
    "pretext_btn": "Fortfahren"
  },
  "pt": {
    "pretext_title": "Você foi redirecionado",
    "pretext_desc": "Aguarde enquanto verificamos sua conexão...",
    "pretext_btn": "Continuar"
  },
  "ar": {
    "pretext_title": "تمت إعادة توجيهك",
    "pretext_desc": "يرجى الانتظار بينما نتحقق من اتصالك...",
    "pretext_btn": "متابعة"
  }
};
if(translations[lang]){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(translations[lang][key]) el.textContent = translations[lang][key];
  });
}
</script>
</body>
</html>
