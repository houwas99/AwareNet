<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ dl_title }} — {{ campaign_name }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .download-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      color: #fff;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .file-info {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .file-info .file-icon {
      font-size: 28px;
    }
    .file-info .file-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      word-break: break-all;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    .btn-download:active {
      transform: translateY(0);
    }
    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 0.75rem;
      color: #999;
    }
    .secure-badge span { font-size: 14px; }
  </style>
</head>
<body>
  <div class="download-card">
    <div class="icon-wrap">⬇</div>
    <h1>{{ dl_title }}</h1>
    <p>{{ dl_desc }}</p>
    <div class="file-info">
      <span class="file-icon">📄</span>
      <span class="file-name">{{ download_display_name }}</span>
    </div>
    <a class="btn-download" href="/download-file/{{ slug }}/{{ download_file_url }}" download>
      ⬇ {{ dl_btn }}
    </a>
    <div class="secure-badge">
      <span>🔒</span> {{ dl_secure }}
    </div>

  </div>
</body>
</html>
